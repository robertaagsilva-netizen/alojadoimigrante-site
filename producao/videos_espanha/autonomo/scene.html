const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

const eback = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);

const MAN = new THREE.MeshStandardMaterial({ color: 0x9c9a94, roughness: 0.6, metalness: 0.05 });

function makeMan(scale = 1, mat = null) {

  const neck = joint(spine, 0, 0.66, 0);
  const nk = cap(0.06, 0.06); nk.position.y = 0.04; neck.add(nk);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 24, 18), MAN_); head.scale.set(0.9, 1.12, 0.95); head.position.y = 0.24; head.castShadow = true; neck.add(head);

    const j1 = joint(parent, x, y, z); const a = cap(r1, l1); a.position.y = -l1 / 2 - r1 * 0.4; j1.add(a);
    const j2 = joint(j1, 0, -l1 - r1 * 0.6, 0); const b = cap(r2, l2); b.position.y = -l2 / 2 - r2 * 0.4; j2.add(b);

  }
  const [shL, elL] = limb(spine, -0.27, 0.56, 0, 0.065, 0.26, 0.055, 0.26);
  const [shR, elR] = limb(spine, 0.27, 0.56, 0, 0.065, 0.26, 0.055, 0.26);
  const [hipL, knL] = limb(hips, -0.11, -0.05, 0, 0.085, 0.38, 0.07, 0.38);
  const [hipR, knR] = limb(hips, 0.11, -0.05, 0, 0.085, 0.38, 0.07, 0.38);
  for (const k of [knL, knR]) { const f = box(0.13, 0.07, 0.24, MAN_, 0.03); f.position.set(0, -0.47, 0.05); k.add(f); }
  const J = { man, hips, spine, neck, head, shL, elL, shR, elR, hipL, knL, hipR, knR };
  J.pose = (t, o = {}) => {

    spine.rotation.set(br + (o.lean || 0), 0, 0);
    neck.rotation.set(0.05 * Math.sin(t * 1.3), o.look || 0, 0);
    const w = o.walk || 0; // 0..1 fase de passos ativa
    const ph = Math.sin((o.walkPhase || 0) * Math.PI * 2) * w;
    hipL.rotation.set(0.35 * ph, 0, 0); hipR.rotation.set(-0.35 * ph, 0, 0);
    knL.rotation.set(Math.max(0, -0.5 * ph), 0, 0); knR.rotation.set(Math.max(0, 0.5 * ph), 0, 0);
    const pt = o.point || 0;

    shL.rotation.set(-0.25 * ph - (o.wave || 0) * 2.6, 0, -0.08 - (o.wave || 0) * 0.3); elL.rotation.set(-(o.wave || 0) * 0.6, 0, 0);
    if (o.sit) {
      const s = o.sit;
      hips.position.y = 1.0 - 0.38 * s;
      hipL.rotation.x = hipR.rotation.x = -1.5 * s; knL.rotation.x = knR.rotation.x = 1.5 * s;
      shL.rotation.x = shR.rotation.x = -0.5 * s; elL.rotation.x = elR.rotation.x = -0.6 * s;
      spine.rotation.x = -0.12 * s + br;
    } else hips.position.y = 1.0;

}
